<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* layout: full-bleed 3D stage, HUD layer with safe gutters, modal screens centred over it */
:root{
  --bg:#0b0910; --ink:#efe3cc; --dim:#9a8f84; --ember:#ff9d42; --blood:#e5484d;
  --moss:#6fd29a; --mana:#5cc8ff; --gold:#f5c542; --line:#4a4153;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --font:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#hurt{background:radial-gradient(ellipse at center,transparent 40%,rgba(229,72,77,.7));opacity:0}
.stats{position:absolute;top:10px;left:var(--gl);width:min(54vw,230px);display:grid;gap:5px}
.bar{position:relative;height:16px;background:#1b1720;border:2px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left center;background:var(--blood);transition:transform .12s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;padding:0 5px;font-size:11px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.bar.st{height:9px}.bar.st i{background:var(--moss)}
.bar.xp{height:6px}.bar.xp i{background:var(--mana)}
.row{display:flex;gap:12px;font-size:13px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
#gold{color:var(--gold)}
.side{position:absolute;top:10px;right:var(--gr);display:grid;justify-items:end;gap:6px}
.mm{width:104px;height:104px;image-rendering:pixelated;border:2px solid var(--line);background:rgba(0,0,0,.45)}
.floorlab{font-size:18px;color:var(--ember);text-shadow:1px 1px 0 #000}
.mini{pointer-events:auto;background:rgba(20,15,24,.7);color:var(--dim);border:2px solid var(--line);font-size:12px;padding:3px 8px}
.boss{position:absolute;top:126px;left:var(--gl);right:var(--gr);text-align:center}
.bossn{font-size:13px;color:var(--ember);text-shadow:1px 1px 0 #000;margin-bottom:3px}
.bossbar{height:12px}
#joyzone{position:absolute;left:0;bottom:0;width:58%;height:62%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border:2px solid rgba(239,227,204,.28);border-radius:50%;background:rgba(239,227,204,.05)}
#joyBase.on{border-color:rgba(239,227,204,.6)}
#joyKnob{position:absolute;width:48px;height:48px;left:50%;top:50%;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,157,66,.5);border:2px solid var(--ember)}
.act{position:absolute;border-radius:50%;border:2px solid var(--ember);background:rgba(20,15,24,.62);color:var(--ink);pointer-events:auto;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.act.on{background:rgba(255,157,66,.35);transform:scale(.94)}
#btnA{right:var(--gr);bottom:24px;width:96px;height:96px;font-size:20px}
#btnD{right:calc(var(--gr) + 108px);bottom:20px;width:66px;height:66px;font-size:14px;border-color:var(--mana)}
#btnP{right:calc(var(--gr) + 14px);bottom:132px;width:58px;height:58px;font-size:13px;border-color:var(--moss)}

.dmg{position:absolute;left:0;top:0;font-size:18px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none;will-change:transform;white-space:nowrap}
.dmg.crit{color:var(--ember);font-size:26px}.dmg.heal{color:var(--moss)}.dmg.hurt{color:var(--blood);font-size:22px}.dmg.gold{color:var(--gold);font-size:15px}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:2px 2px 0 #000}
#banner.show{opacity:1}

#banner small{font-size:14px;color:var(--ink)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:15}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(9,7,13,.84);overflow-y:auto}
.screen h1{margin:0;font-weight:400;font-size:clamp(38px,12vw,70px);color:var(--ember);letter-spacing:.06em;text-wrap:balance}
.screen h2{margin:0;font-weight:400;font-size:clamp(24px,7vw,36px);text-wrap:balance}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.lead{margin:0;max-width:34ch;line-height:1.7;color:var(--ink)}
.keys{display:grid;gap:6px;max-width:42ch;font-size:12px;line-height:1.6;color:var(--dim);text-align:left}
.keys b{color:var(--mana);font-weight:400;margin-right:6px}
.best{font-size:13px;color:var(--gold)}
.btn{font-size:18px;color:#1a1008;background:var(--ember);border:0;padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 #a5560f}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a5560f}
.btn:focus-visible,.card:focus-visible,.mini:focus-visible{outline:2px solid var(--mana);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:min(580px,100%)}
.card{text-align:left;background:#17131d;color:var(--ink);border:2px solid var(--line);padding:12px;cursor:pointer;display:grid;gap:5px;font-size:13px}
.card b{color:var(--ember);font-size:16px;font-weight:400}
.card small{color:var(--dim);font-size:12px;line-height:1.5}
.card:hover{border-color:var(--ember)}
</style>

<div id="app">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const TILE=2, MW=46, MH=46, WALL_H=2.4;
const CAM_OFF={x:0,y:14,z:6};
const BAR_PITCH=-Math.atan2(CAM_OFF.y,CAM_OFF.z);
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};
const turnTo=(a,b,k)=>a+clamp(angDiff(b,a),-k,k)*(-1)*(-1);
const makeCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
let state='title';
const setState=s=>{state=s;};

/* ---------- audio ---------- */
let actx=null,muted=false;
function audioInit(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}catch(e){actx=null;}
}
function tone(f,d,type,v,slide){
  if(!actx||muted)return;
  try{
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
const sfx={
  swing(){tone(420,.11,'sawtooth',.035,-260);},
  hit(){tone(180,.09,'square',.06,-90);},
  crit(){tone(520,.12,'square',.06,-300);tone(90,.14,'sawtooth',.06,-30);},
  hurt(){tone(140,.22,'sawtooth',.08,-90);},
  coin(){tone(880,.07,'square',.04);setTimeout(()=>tone(1320,.09,'square',.04),55);},
  potion(){tone(520,.15,'sine',.07,300);},
  dodge(){tone(260,.14,'triangle',.05,-120);},
  up(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'square',.05),i*80));},
  stairs(){tone(330,.4,'triangle',.06,-200);},
  boom(){tone(70,.5,'sawtooth',.12,-40);},
  shoot(){tone(700,.1,'triangle',.04,-300);},
  die(){tone(200,.7,'sawtooth',.09,-160);},
  open(){tone(300,.12,'square',.05,200);}
};

/* ---------- three.js setup ---------- */
const app=$('app'),canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setClearColor(0x0b0910);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0b0910,15,34);
const camera=new THREE.PerspectiveCamera(48,1,0.5,80);
scene.add(new THREE.AmbientLight(0x9a8fc0,0.95));
const torchLight=new THREE.PointLight(0xffb060,1.8,20,1.5);
scene.add(torchLight);
const wallLights=[0,1,2].map(()=>{const l=new THREE.PointLight(0xff8a30,0,12,1.8);scene.add(l);return l;});
const level=new THREE.Group(),actors=new THREE.Group();
scene.add(level,actors);
let viewW=800,viewH=600;
function resize(){
  viewW=app.clientWidth||window.innerWidth||800;viewH=app.clientHeight||window.innerHeight||600;
  renderer.setSize(viewW,viewH,false);
  const a=viewW/viewH;camera.aspect=a;camera.fov=a<0.8?64:(a<1.2?56:46);camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

const lam=(color,extra)=>new THREE.MeshLambertMaterial(Object.assign({color},extra||{}));
const shared=o=>{o.userData.shared=true;return o;};
const blobGeo=shared(new THREE.CircleGeometry(1,16));blobGeo.rotateX(-Math.PI/2);
const blobMat=shared(new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.38,depthWrite:false}));
function blob(r){const m=new THREE.Mesh(blobGeo,blobMat);m.scale.set(r,1,r);m.position.y=0.03;return m;}
function disposeTree(o){
  o.traverse(c=>{
    if(c.isInstancedMesh)c.dispose();
    if(c.geometry&&!c.geometry.userData.shared)c.geometry.dispose();
    if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>{if(m.userData.shared)return;if(m.map)m.map.dispose();m.dispose();});}
  });
}
function clearGroup(g){while(g.children.length){const c=g.children[0];g.remove(c);disposeTree(c);}}

/* ---------- textures ---------- */
function wallTexture(){
  const c=makeCanvas(64,64),g=c.getContext('2d');
  g.fillStyle='#1a1720';g.fillRect(0,0,64,64);
  for(let row=0;row<4;row++){
    const y=row*16,off=(row%2)*16;
    for(let col=-1;col<3;col++){
      g.fillStyle='hsl(268,9%,'+(36+Math.random()*12)+'%)';
      g.fillRect(col*32+off+1,y+1,30,14);
    }
  }
  for(let i=0;i<60;i++){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(rint(0,63),rint(0,63),2,1);}
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
  return t;
}
const wallMat=shared(new THREE.MeshLambertMaterial({map:wallTexture()}));
const wallGeo=shared(new THREE.BoxGeometry(TILE,WALL_H,TILE));

/* ---------- dungeon ---------- */
let grid=null,dist=null,explored=null,rooms=[],startRoom=null,stairsRoom=null;
const bfsQ=new Int32Array(MW*MH);
const isFloor=(tx,ty)=>tx>=0&&ty>=0&&tx<MW&&ty<MH&&grid[ty*MW+tx]===1;
const blockedAt=(x,z)=>!isFloor(Math.floor(x/TILE),Math.floor(z/TILE));
const hitsWall=(x,z,r)=>blockedAt(x-r,z-r)||blockedAt(x+r,z-r)||blockedAt(x-r,z+r)||blockedAt(x+r,z+r);
function moveEnt(e,dx,dz,r){
  if(!hitsWall(e.x+dx,e.z,r))e.x+=dx;
  if(!hitsWall(e.x,e.z+dz,r))e.z+=dz;
}
function hasLOS(x1,z1,x2,z2){
  const d=Math.hypot(x2-x1,z2-z1),n=Math.ceil(d/0.7);
  for(let i=1;i<n;i++){const t=i/n;if(blockedAt(x1+(x2-x1)*t,z1+(z2-z1)*t))return false;}
  return true;
}
function computeFlow(px,pz){
  const tx=Math.floor(px/TILE),ty=Math.floor(pz/TILE);
  dist.fill(-1);
  if(!isFloor(tx,ty))return;
  let h=0,t=0;bfsQ[t++]=ty*MW+tx;dist[ty*MW+tx]=0;
  while(h<t){
    const c=bfsQ[h++],cx=c%MW,cy=(c/MW)|0,cd=dist[c];
    const nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let k=0;k<4;k++){
      const nx=cx+nb[k][0],ny=cy+nb[k][1];
      if(isFloor(nx,ny)&&dist[ny*MW+nx]<0){dist[ny*MW+nx]=cd+1;bfsQ[t++]=ny*MW+nx;}
    }
  }
}
function flowDir(e){
  const tx=Math.floor(e.x/TILE),ty=Math.floor(e.z/TILE);
  let best=dist[ty*MW+tx];if(best<0)return null;
  let bx=0,bz=0,found=false;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const nx=tx+dx,ny=ty+dy;
    if(!isFloor(nx,ny))continue;
    if(dx&&dy&&(!isFloor(tx+dx,ty)||!isFloor(tx,ty+dy)))continue;
    const dd=dist[ny*MW+nx];
    if(dd>=0&&dd<best){best=dd;bx=nx;bz=ny;found=true;}
  }
  if(!found)return null;
  const cx=(bx+.5)*TILE-e.x,cz=(bz+.5)*TILE-e.z,l=Math.hypot(cx,cz)||1;
  return {x:cx/l,z:cz/l};
}
function genDungeon(){
  const g=new Uint8Array(MW*MH),rs=[];
  const carve=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>0&&j>0&&i<MW-1&&j<MH-1)g[j*MW+i]=1;};
  let tries=0;
  while(rs.length<10&&tries<250){
    tries++;
    const w=rint(6,11),h=rint(6,10),x=rint(2,MW-w-3),y=rint(2,MH-h-3);
    let ok=true;
    for(const r of rs){if(x<r.x+r.w+3&&x+w+3>r.x&&y<r.y+r.h+3&&y+h+3>r.y){ok=false;break;}}
    if(!ok)continue;
    rs.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});carve(x,y,w,h);
  }
  rs.sort((a,b)=>a.cx-b.cx);
  const link=(a,b)=>{
    const x1=Math.min(a.cx,b.cx),x2=Math.max(a.cx,b.cx);carve(x1,a.cy,x2-x1+2,2);
    const y1=Math.min(a.cy,b.cy),y2=Math.max(a.cy,b.cy);carve(b.cx,y1,2,y2-y1+2);
  };
  for(let i=0;i<rs.length-1;i++)link(rs[i],rs[i+1]);
  for(let i=0;i<2;i++)link(pick(rs),pick(rs));
  rs.forEach(r=>{if(r.w>=8&&r.h>=8){[[2,2],[r.w-3,2],[2,r.h-3],[r.w-3,r.h-3]].forEach(p=>{g[(r.y+p[1])*MW+r.x+p[0]]=0;});}});
  const st=rs[0];let far=rs[1],fd=0;
  rs.forEach(r=>{const d=Math.hypot(r.cx-st.cx,r.cy-st.cy);if(d>fd){fd=d;far=r;}});
  return {grid:g,rooms:rs,start:st,stairs:far};
}
/* ---------- effects ---------- */
const parts=[];let partIdx=0;
for(let i=0;i<110;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.14),new THREE.MeshBasicMaterial({color:0xffffff}));
  m.visible=false;scene.add(m);parts.push({m,vx:0,vy:0,vz:0,life:0});
}
function burst(x,y,z,color,n){
  for(let i=0;i<n;i++){
    const p=parts[partIdx];partIdx=(partIdx+1)%parts.length;
    p.m.position.set(x,y,z);p.m.material.color.setHex(color);p.m.visible=true;
    p.vx=rnd(-4,4);p.vy=rnd(2,6);p.vz=rnd(-4,4);p.life=rnd(.3,.6);
  }
}
function ringBurst(x,z,r,color){
  for(let i=0;i<24;i++){
    const a=i/24*Math.PI*2,p=parts[partIdx];partIdx=(partIdx+1)%parts.length;
    p.m.position.set(x+Math.sin(a)*r*.5,.3,z+Math.cos(a)*r*.5);p.m.material.color.setHex(color);p.m.visible=true;
    p.vx=Math.sin(a)*r*2;p.vy=rnd(1,3);p.vz=Math.cos(a)*r*2;p.life=rnd(.3,.5);
  }
}
function updateParts(dt){
  for(const p of parts){
    if(!p.m.visible)continue;
    p.life-=dt;if(p.life<=0){p.m.visible=false;continue;}
    p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.05,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;
  }

function updateEnemy(e,dt){

function updateEnemies(dt){

      const b=enemies[j];if(b.dead||!b.aggro)continue;

    }
  }

}

function startAttack(){
  const p=player;
  p.combo=p.comboT>0?(p.combo+1)%3:0;
  p.state='attack';p.t=0;p.dur=(p.combo===2?.52:.36)/p.atkSpd;p.hitDone=false;p.hitSet.clear();p.atkReq=0;p.swingDir=p.combo===1?-1:1;
  p.st=Math.max(0,p.st-9);p.stDelay=.5;
  let best=null,bd=4.5;
  for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-p.x,e.z-p.z);if(d<bd){bd=d;best=e;}}
  if(best)p.ang=Math.atan2(best.x-p.x,best.z-p.z);
  p.dirx=Math.sin(p.ang);p.dirz=Math.cos(p.ang);
  sfx.swing();
  spawnSlash(p.x,p.z,p.ang,(p.combo===2?3.4:2.8)*p.rng,p.combo===2);
}
function doHit(){
  const p=player,R=(p.combo===2?3.4:2.8)*p.rng,arc=p.combo===2?1.9:1.1,mult=[1,1.1,1.8][p.combo];
  for(const e of enemies){
    if(e.dead||p.hitSet.has(e))continue;
    const dx=e.x-p.x,dz=e.z-p.z,d=Math.hypot(dx,dz);
    if(d>R+e.r)continue;
    if(d>e.r+.4&&Math.abs(angDiff(Math.atan2(dx,dz),p.ang))>arc)continue;
    p.hitSet.add(e);
    const crit=Math.random()<p.crit;
    const dmg=p.atk*mult*rnd(.9,1.1)*(crit?2:1),kb=(p.combo===2?9:5)*(e.type==='golem'?.1:1);
    hurtEnemy(e,dmg,dx/(d||1)*kb,dz/(d||1)*kb,crit);
  }
}
function updatePlayer(dt){
  const p=player;
  let ix=0,iz=0;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))ix-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))ix+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp'))iz-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))iz+=1;
  ix+=joy.x;iz+=joy.y;
  let il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;il=1;}if(il<.15){ix=iz=0;il=0;}
  p.inv-=dt;p.dodgeCd-=dt;p.comboT-=dt;p.stDelay-=dt;p.potCd-=dt;p.atkReq-=dt;p.dodgeReq-=dt;
  if(p.stDelay<=0)p.st=Math.min(p.maxSt,p.st+p.stRegen*dt);
  const canDodge=p.dodgeReq>0&&p.dodgeCd<=0&&p.st>=20;
  const startDodge=()=>{
    p.state='dodge';p.t=0;p.dur=.28;p.inv=Math.max(p.inv,.34);p.dodgeCd=.15;p.dodgeReq=0;p.st-=26;if(p.st<0)p.st=0;p.stDelay=.6;
    if(il>0){p.dirx=ix/il;p.dirz=iz/il;}else{p.dirx=Math.sin(p.ang);p.dirz=Math.cos(p.ang);}
    p.ang=Math.atan2(p.dirx,p.dirz);sfx.dodge();burst(p.x,.2,p.z,0xb8aea0,5);
  };
  p.moving=false;
  if(p.state==='move'){
    if(il>0){
      p.dirx=ix/il;p.dirz=iz/il;p.ang=turnTo(p.ang,Math.atan2(ix,iz),16*dt);
      moveEnt(p,ix*p.spd*dt,iz*p.spd*dt,.45);p.moving=true;
    }
    if(canDodge)startDodge();
    else if((p.atkReq>0||heldAtk())&&p.st>=6)startAttack();
  }else if(p.state==='attack'){
    p.t+=dt;
    if(il>0)moveEnt(p,ix*p.spd*.3*dt,iz*p.spd*.3*dt,.45);
    if(p.t<p.dur*.35)moveEnt(p,Math.sin(p.ang)*6*dt,Math.cos(p.ang)*6*dt,.45);
    if(!p.hitDone&&p.t>=p.dur*.3){p.hitDone=true;doHit();}
    if(canDodge&&p.t>p.dur*.45)startDodge();
    else if(p.t>=p.dur){
      p.comboT=.45;p.state='move';
      if((p.atkReq>0||heldAtk())&&p.st>=6)startAttack();
    }
  }else if(p.state==='dodge'){
    p.t+=dt;moveEnt(p,p.dirx*12.5*dt,p.dirz*12.5*dt,.4);
    if(p.t>=p.dur){p.state='move';}
  }
  // pose
  const m=pm;m.g.position.set(p.x,0,p.z);m.g.rotation.y=p.ang;
  p.wt+=dt*(p.moving?10:2);
  m.l1.rotation.x=p.moving?Math.sin(p.wt)*.6:0;m.l2.rotation.x=p.moving?-Math.sin(p.wt)*.6:0;
  m.rig.rotation.x=0;m.rig.position.y=.9+(p.moving?Math.abs(Math.sin(p.wt))*.06:0);
  if(p.state==='attack'){
    const k=clamp(p.t/p.dur,0,1),e=1-Math.pow(1-k,2);
    if(p.combo===2)m.sw.rotation.set(-2.2+e*2.8,0,0);
    else m.sw.rotation.set(.1,p.swingDir*(-1.5+e*3),0);
  }else if(p.state==='dodge'){
    m.rig.rotation.x=p.t/p.dur*Math.PI*2;m.sw.rotation.set(-.7,-.35,0);
  }else m.sw.rotation.set(-.7,-.35,0);
  m.g.visible=!(p.inv>0&&p.state!=='dodge'&&Math.floor(p.inv*20)%2===0);
}

window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')attackHeld=false;});
app.addEventListener('contextmenu',e=>e.preventDefault());
function bindBtn(id,down,up){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(x){}el.classList.add('on');audioInit();down();});
  const u=()=>{el.classList.remove('on');if(up)up();};
  el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);
}
bindBtn('btnA',()=>{attackHeld=true;pressAttack();},()=>{attackHeld=false;});
bindBtn('btnD',pressDodge);
bindBtn('btnP',pressPotion);
const jz=$('joyzone'),jb=$('joyBase'),jk=$('joyKnob'),JR=52;
function joyDefault(){
  const r=jz.getBoundingClientRect();
  jb.style.left=(Math.max(16,r.width*.22))+'px';jb.style.top=Math.max(70,(r.height||300)-90)+'px';
}
function joyMove(e){
  const r=jz.getBoundingClientRect();
  let dx=e.clientX-r.left-joy.ox,dy=e.clientY-r.top-joy.oy;const l=Math.hypot(dx,dy);
  if(l>JR){dx*=JR/l;dy*=JR/l;}
  joy.x=dx/JR;joy.y=dy/JR;jk.style.transform='translate('+dx+'px,'+dy+'px)';
}
jz.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||joy.id!==null)return;
  joy.id=e.pointerId;try{jz.setPointerCapture(e.pointerId);}catch(x){}
  const r=jz.getBoundingClientRect();joy.ox=e.clientX-r.left;joy.oy=e.clientY-r.top;
  jb.style.left=joy.ox+'px';jb.style.top=joy.oy+'px';jb.classList.add('on');joyMove(e);audioInit();
});
jz.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e);});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;jk.style.transform='translate(0,0)';jb.classList.remove('on');joyDefault();};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);
joyDefault();

/* ---------- HUD & minimap ---------- */
const mmC=$('mm');mmC.width=MW;mmC.height=MH;
const mmG=mmC.getContext('2d'),mmBase=makeCanvas(MW,MH),mbg=mmBase.getContext('2d');
function mmRedraw(){
  mbg.clearRect(0,0,MW,MH);
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    if(!explored[ty*MW+tx])continue;
    mbg.fillStyle=grid[ty*MW+tx]?'#6d6478':'#2b2733';mbg.fillRect(tx,ty,1,1);
  }
}
function reveal(){
  const tx=Math.floor(player.x/TILE),ty=Math.floor(player.z/TILE);
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){
    const x=tx+dx,y=ty+dy;
    if(x<0||y<0||x>=MW||y>=MH||dx*dx+dy*dy>26)continue;
    explored[y*MW+x]=1;
  }
  mmRedraw();
}
function drawMinimap(){
  mmG.clearRect(0,0,MW,MH);mmG.drawImage(mmBase,0,0);
  const ex=t=>explored[Math.floor(t.z/TILE)*MW+Math.floor(t.x/TILE)];
  if(ex(stairs)){mmG.fillStyle=stairs.active?'#66e0ff':'#a04848';mmG.fillRect(Math.floor(stairs.x/TILE)-1,Math.floor(stairs.z/TILE)-1,2,2);}
  mmG.fillStyle='#f5c542';
  chests.forEach(c=>{if(!c.open&&ex(c))mmG.fillRect(Math.floor(c.x/TILE),Math.floor(c.z/TILE),1,1);});
  mmG.fillStyle='#e5484d';
  enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-player.x,e.z-player.z)<18)mmG.fillRect(Math.floor(e.x/TILE),Math.floor(e.z/TILE),1,1);});
  mmG.fillStyle='#ff9d42';mmG.fillRect(Math.floor(player.x/TILE)-1,Math.floor(player.z/TILE)-1,2,2);
}
const hc={};
function setTxt(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v;}}
function updateHud(){
  const p=player;
  $('hpI').style.transform='scaleX('+clamp(p.hp/p.maxHp,0,1).toFixed(3)+')';
  setTxt('hpT',Math.max(0,Math.ceil(p.hp))+' / '+p.maxHp);
  $('stI').style.transform='scaleX('+clamp(p.st/p.maxSt,0,1).toFixed(3)+')';
  $('xpI').style.transform='scaleX('+clamp(p.xp/p.xpNext,0,1).toFixed(3)+')';
  setTxt('lv','Lv '+p.lvl);setTxt('gold',p.gold+' G');setTxt('pot','薬 x'+p.potions);setTxt('btnPn',String(p.potions));
}

/* ---------- world step ---------- */
let lightT=0,lightAcc=0;
function updateWorld(dt){
  updatePlayer(dt);
  const tile=Math.floor(player.z/TILE)*MW+Math.floor(player.x/TILE);
  if(tile!==lastTile){lastTile=tile;computeFlow(player.x,player.z);reveal();}
  updateEnemies(dt);updateProjs(dt);updateDrops(dt);
  for(const c of chests){
    if(c.open||Math.hypot(c.x-player.x,c.z-player.z)>1.5)continue;
    c.open=true;c.lid.rotation.x=-1.2;sfx.open();
    for(let i=0;i<rint(4,7);i++)dropItem('coin',c.x+rnd(-.8,.8),c.z+rnd(.5,1.5),Math.round(rint(4,7)*(1+floor*.25)*player.goldMul));
    if(Math.random()<.4)dropItem('potion',c.x,c.z+1,1);
    if(Math.random()<.4){upQueue.push({kick:'宝箱',title:'遺物を選べ'});showNextUpgrade();}
  }
  if(stairs.active&&Math.hypot(stairs.x-player.x,stairs.z-player.z)<1.4)nextFloor();
}
function nextFloor(){
  if(state!=='play')return;
  setState('trans');sfx.stairs();$('fade').style.opacity=1;
  setTimeout(()=>{
    floor++;saveBest(Math.max(loadBest(),floor));buildFloor();$('boss').hidden=true;$('fade').style.opacity=0;
    if(state==='trans')setState('play');
  },420);
}
function updateLights(dt){
  lightT+=dt;
  torchLight.position.set(player.x,3.2,player.z+.5);
  torchLight.intensity=1.8+Math.sin(lightT*13)*.08+Math.sin(lightT*7.3)*.06;
  lightAcc-=dt;
  if(lightAcc<=0){
    lightAcc=.25;
    const s=torches.map(t=>({t,d:Math.hypot(t.x-player.x,t.z-player.z)})).sort((a,b)=>a.d-b.d);
    wallLights.forEach((l,i)=>{const o=s[i];if(o&&o.d<22){l.position.set(o.t.x,o.t.y,o.t.z);l.userData.on=1;}else l.userData.on=0;});
  }
  wallLights.forEach(l=>{l.intensity=l.userData.on?1.1+Math.sin(lightT*11+l.position.x)*.15:0;});
  for(const t of torches)t.f.scale.setScalar(1+Math.sin(lightT*12+t.ph)*.18);
}
function startGame(){
  Object.assign(player,freshPlayer());player.hitSet=new Set();
  floor=1;stats={kills:0,gold:0};upQueue.length=0;
  buildFloor();
  $('title').hidden=true;$('over').hidden=true;$('up').hidden=true;$('pause').hidden=true;$('boss').hidden=true;
  setState('play');hudDirty=true;
}
$('startBtn').addEventListener('click',()=>{audioInit();startGame();});
$('retryBtn').addEventListener('click',()=>{audioInit();startGame();});
$('resumeBtn').addEventListener('click',()=>{$('pause').hidden=true;setState('play');});
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'音 OFF':'音 ON';});

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(hitstop>0){hitstop-=dt;dt*=.08;}
  if(state==='play'){updateWorld(dt);}
  if(state==='play'||state==='title'||state==='trans'){
    updateParts(dt);updateSlashes(dt);updateTexts(dt);updateLights(dt);
  }
  // camera
  const k=1-Math.exp(-8*dt);
  if(state==='title'){camX+=(((startRoom.cx+.5)*TILE+Math.sin(now/4000)*4)-camX)*k;camZ+=(((startRoom.cy+.5)*TILE)-camZ)*k;}
  else{camX+=(player.x-camX)*k;camZ+=(player.z-camZ)*k;}
  shake=Math.max(0,shake-dt*2.2);
  const sx=(Math.random()-.5)*shake,sz=(Math.random()-.5)*shake;
  camera.position.set(camX+CAM_OFF.x+sx,CAM_OFF.y,camZ+CAM_OFF.z+sz);camera.lookAt(camX,0,camZ);
  hurtFlash=Math.max(0,hurtFlash-dt*2.5);
  const low=state==='play'&&player.hp<player.maxHp*.3?.25+Math.sin(now/200)*.12:0;
  $('hurt').style.opacity=Math.max(hurtFlash,low).toFixed(2);
  updateHud();
  if(mmDirty||now%100<20){drawMinimap();mmDirty=false;}
  renderer.render(scene,camera);
}
$('best').textContent=loadBest()?'最深記録 B'+loadBest()+'F':'';
buildFloor();
requestAnimationFrame(frame);
</script>
